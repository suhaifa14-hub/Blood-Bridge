<!DOCTYPE html>
<html lang="en">
<head>

<body>

  <form action="{% url 'DonorList'%}" method="POST">
   {% csrf_token %}

    <div class="container">
      <h1> Patients Blood Group</h1>
      <select id="bldgrp" name="bldgrp" required>
        <option value=""> Select Blood Group </option>
        <option value="A+">A+ </option>
        <option value="A-">A- </option>
        <option value="B+">B+ </option>
        <option value="B-"> B- </option>
        <option value="AB+"> AB+ </option>
        <option value="AB-"> AB- </option>
        <option value="O+">O+ </option>
        <option value="O-">O- </option>
      </select>
    </div>

    <div class="container">
    <input type="tel" id="num" name="num" placeholder="Enter your contact number" required>
     </div>
    

    
    <div class="container center-button">
   <button id ="searchbtn">Search Donors</button>
    </div>

 </form>
 </div>
