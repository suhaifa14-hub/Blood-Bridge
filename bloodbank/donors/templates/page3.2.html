{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="{% static 'donors/css/page3.css' %}?v=2">
</head>
<body>
      <!-- NAVBAR -->
  <nav class="navbar">
      <a href="/" class="logo">Blood<span>Bridge</span> 🩸</a>
        <ul class="nav-links">
            <li><a href="/" class="active-link">Home</a></li>
            <li><a href="awareness">Why Donate?</a></li>
            <li><a href="register">Donate</a></li>
            <li><a href="request">Find Blood</a></li>
            <li><a href="userlogin">My Account</a></li>
        </ul>
  </nav>
  <form action="{% url 'D_List_location'%}" method="POST">
     {% csrf_token %}
    <input type="hidden" name="bldgrp" value="{{ sbldgrp }}">
     <input type="hidden" name="num" value="{{snum}}">
  <div class="page-center">
    
    <div class="container">
      <h1>Location: Bangladesh</h1>
      
      <label>Division</label>
      <select id="division" onchange="loadDistricts()" name="division" required>
        <option value=""> Select Division </option>
        <option value="dhaka">Dhaka</option>
        <option value="chattogram">Chattogram</option>
        <option value="rajshahi">Rajshahi</option>
        <option value="khulna">Khulna</option>
        <option value="barishal">Barishal</option>
        <option value="sylhet">Sylhet</option>
        <option value="rangpur">Rangpur</option>
        <option value="mymensingh">Mymensingh</option>
      </select>

      <label>District</label>
      <select id="district" name="district" required>
        <option value=""> Select District </option>

      </select>
      
    
    <div class="container center-button">
   <button  id="searchbtn">Search Donors</button>
    </div>

  </div>
  
   
 </form>
      <!-- FOOTER -->
    <footer>
        <p>© 2026 LifeFlow Blood Donation &nbsp;·&nbsp; <a href="awareness">Why Donate?</a> &nbsp;·&nbsp; <a href="register">Donate Now</a></p>
    </footer>
   <script src="{%static 'donors/css/page3.js'%}?v=2"></script>
</body>
</html>
